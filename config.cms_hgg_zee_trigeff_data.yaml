paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: cms_hgg_zee_trigeff_data
  histogram_filename: cms_hgg_zee_trigeff_data.root
run_metadata:
  run_name: cms_hgg_zee_trigeff_data
  base_output_dir: /storage/agrp/berkom/atlas-utilization/output/cms_hgg_zee_trigeff_data
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: false
  do_post_processing: false
  do_histogram_creation: false
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  # Same two DoubleEG records again -- see config.cms_hgg_zee_data.yaml.
  specific_record_ids:
  - 30521
  - 30554
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 8
  env_threshold_memory_mb: 8000
  chunk_yield_threshold_bytes: 2147483648
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: null
  possible_data_tree_names:
  - Events
  - CollectionTree
  create_dirs: true
  show_progress_bar: true
  validated_runs_json: data/cms/validated_runs/Cert_271036-284044_13TeV_Legacy2016_Collisions16_JSON.txt
  # TRIGGER-EFFICIENCY SAMPLE: filtered on an ORTHOGONAL single-electron
  # trigger (verified present in both data and DY branch lists, metadata-
  # only reads, 16 Sep 2026) -- NOT the diphoton trigger, so this sample
  # is unbiased with respect to the diphoton trigger's own efficiency.
  trigger_requirements:
    mode: any
    paths:
    - HLT_Ele27_WPTight_Gsf
  # The diphoton trigger bit is ALSO read (services/parsing/
  # trigger_requirements.py's own "Trigger" scalar-branch-group mechanism
  # only attaches paths listed under trigger_requirements itself -- a
  # SEPARATE branch, requested here via the generic, no-filtering-effect
  # extra_scalar_branches mechanism (domain/config.py), is how it's read
  # WITHOUT being used to cut events). run_zee_selection_on_chunks.py's
  # --record-diphoton-trigger-bit then copies its per-event value into
  # the output as "passes_diphoton_hlt" for every SELECTED event.
  extra_scalar_branches:
    ZeeTrigEffProbe:
    - HLT_Diphoton30_18_R9Id_OR_IsoCaloId_AND_HE_R9Id_Mass90
  read_pileup_info: true
  read_event_weights: false
  extra_object_fields:
    Photons:
    - electronVeto
    - mvaID_WP90
    - isScEtaEB
    - isScEtaEE
    - r9
    - hoe
    - sieie
    - pfRelIso03_all
    - pfRelIso03_chg
    - mvaID
    - cutBased
    - pixelSeed
  particle_counts:
    photons:
      min: 2
      max: 20
  kinematic_cuts:
    photons:
      pt:
        min: 20.0
      bool_require:
      - mvaID_WP90
      bool_any_of:
      - isScEtaEB
      - isScEtaEE
