# ---------------------------------------------------------------------------
# config.cms_mediumscale_complete.yaml
#
# Reduced companion to config.cms_mediumscale_test.yaml.
#
# The 15-files/record run (config.cms_mediumscale_test.yaml) was OOM-killed part
# way through parsing the FIRST record: in the ~7.4 GB Docker VM the parse
# working set (~5 GB) plus the growing in-memory de-dup key set left no room.
# See reports/cms_mediumscale_test/summary.md.
#
# This config runs the SAME four records / per-stream selection / de-dup, but at
# 3 files/record (12 files) so it completes end to end -- providing the dimuon
# Z-peak check, example histograms, and a clean end-to-end timing/memory
# baseline. The true SingleElectron/SingleMuon overlap rate is measured
# separately and much more cheaply by scripts/dup_rate_probe.py (id branches
# only), which can cover 15 files/record without the memory blow-up.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_mediumscale_complete
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: true
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  specific_record_ids:
  - 30529
  - 30562
  - 30530
  - 30563
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 2
  env_threshold_memory_mb: 4500
  chunk_yield_threshold_bytes: 268435456
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 3
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  selection_by_record:
    "30530":
      particle_counts:
        muons:
          min: 1
          max: 4
        electrons:
          min: 0
          max: 4
        jets:
          min: 0
          max: 10
        photons:
          min: 0
          max: 4
    "30563":
      particle_counts:
        muons:
          min: 1
          max: 4
        electrons:
          min: 0
          max: 4
        jets:
          min: 0
          max: 10
        photons:
          min: 0
          max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  - Jets
  - Photons
  min_particles_in_combination: 2
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 100
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
