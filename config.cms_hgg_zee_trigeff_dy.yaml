names:
  run_name: cms_hgg_zee_trigeff_dy
  histogram_filename: cms_hgg_zee_trigeff_dy.root
run_metadata:
  run_name: cms_hgg_zee_trigeff_dy
  base_output_dir: /storage/agrp/berkom/atlas-utilization/output/cms_hgg_zee_trigeff_dy
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: false
  do_post_processing: false
  do_histogram_creation: false
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data_zee_trigeff_dy
  file_urls_path: ./output/metadata_cache_zee_trigeff_dy.json
  jobs_logs_path: ./output/logs_zee_trigeff_dy
  release_years: []
  specific_record_ids:
  - 35669
  parse_mc: true
  use_multiprocessing: false
  parallel_processes: 4
  threads: 8
  env_threshold_memory_mb: 8000
  chunk_yield_threshold_bytes: 2147483648
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: null
  possible_data_tree_names:
  - Events
  - CollectionTree
  create_dirs: true
  show_progress_bar: true
  # TRIGGER-EFFICIENCY SAMPLE (simulation side) -- see
  # config.cms_hgg_zee_trigeff_data.yaml's comments for the full
  # reasoning; identical structure here.
  trigger_requirements:
    mode: any
    paths:
    - HLT_Ele27_WPTight_Gsf
  extra_scalar_branches:
    ZeeTrigEffProbe:
    - HLT_Diphoton30_18_R9Id_OR_IsoCaloId_AND_HE_R9Id_Mass90
  read_pileup_info: true
  read_event_weights: true
  extra_object_fields:
    Photons:
    - electronVeto
    - mvaID_WP90
    - isScEtaEB
    - isScEtaEE
    - r9
    - hoe
    - sieie
    - pfRelIso03_all
    - pfRelIso03_chg
    - mvaID
    - cutBased
    - pixelSeed
  particle_counts:
    photons:
      min: 2
      max: 20
  kinematic_cuts:
    photons:
      pt:
        min: 20.0
      bool_require:
      - mvaID_WP90
      bool_any_of:
      - isScEtaEB
      - isScEtaEE
