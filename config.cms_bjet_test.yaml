# ---------------------------------------------------------------------------
# config.cms_bjet_test.yaml
#
# FIRST test of the CMS b-jet tagging path (Part C of the PR#17 cherry-pick
# task). CMS b-tagging has never been enabled in any CMS config before.
#
# How CMS b-tagging works in this codebase:
#   * parser reads the per-jet DeepJet discriminant Jet_btagDeepFlavB
#     (a "direct object" in the cms-nanoaod schema)
#   * FileParser._calculate_btagging_and_split() marks a jet as a b-jet when
#     Jet_btagDeepFlavB > jet_btagging_thresholds["Jet_btagDeepFlavB"]
#   * tagged jets move to the BJets collection, the rest stay in Jets
#   * BJets must be listed in objects_to_calculate to get b-jet combinations
#
# Threshold 0.25 = the CMS DeepJet (DeepFlavour) *Medium* working point, as
# standardized project-wide on 2026-09-07 (per Maryna Borysova) — previously
# 0.2598 (the official UL2016 post-VFP calibration value for Run2016G/H,
# records 30529/30562) everywhere in this project, including in this file and
# in reports/btag_score_distribution/summary.md's original numbers; see that
# report's dated correction note for old-vs-new figures. Medium is the
# standard analysis choice: ~70-80% b efficiency, ~1% light mistag, so we
# expect *some* jets tagged, not none and not all.
#
# Based on config.cms_records_master.yaml, with:
#   * base_output_dir -> ./output  (local, not the cluster path)
#   * mass-calc input_dir -> ./output/parsed_data
#   * do_mass_calculating: true  (parsing + mass-calc only, per Part C)
#   * enable_jet_tagging: true + jet_btagging_thresholds added
#   * objects_to_calculate -> Electrons, Muons, Jets, BJets
#   * parse memory knobs reduced (threads 4, chunk_yield 512 MB,
#     env_threshold 5000) so a few ~2 GB NANOAOD files fit the 7 GB container
#   * min_events_per_fs -> 5  (want to see rare b-jet channels in this probe)
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_bjet_test
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: false
  do_histogram_creation: false
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  # SingleElectron-only (records 30529, 30562 = /SingleElectron/Run2016G,H),
  # matching the current project scope. See docs/CMS_KNOWN_LIMITATIONS.md.
  specific_record_ids:
  - 30529
  - 30562
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 4
  env_threshold_memory_mb: 5000
  chunk_yield_threshold_bytes: 536870912
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 2
  # --- CMS b-jet tagging (first-ever enable for a CMS run) ---
  enable_jet_tagging: true
  jet_btagging_thresholds:
    Jet_btagDeepFlavB: 0.25    # DeepJet Medium WP, standardized value (was 0.2598)
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  - Jets
  - BJets
  min_particles_in_combination: 2
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 5
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
