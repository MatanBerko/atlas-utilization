# ---------------------------------------------------------------------------
# config.cms_bjet_test_with_histograms.yaml
#
# Based on config.cms_bjet_test.yaml. That config confirmed CMS b-tagging works
# (DeepJet Medium WP, ~7.7% of jets tagged - see reports/cms_bjet_first_test/)
# but had do_post_processing and do_histogram_creation set to FALSE, so it only
# produced a text tagging-rate check, never any histograms/plots.
#
# This config runs the FULL pipeline (parsing -> mass-calc -> post-processing ->
# histogram creation) so we get real b-jet-tagged invariant-mass histograms.
#
# Changes vs config.cms_bjet_test.yaml:
#   * do_post_processing: true, do_histogram_creation: true
#   * max_files_to_process: 3  (was 2; same small, safe scale proven to fit this
#     machine's memory in the medium-scale tests)
#   * everything else identical: SingleElectron records 30529/30562,
#     enable_jet_tagging: true, Jet_btagDeepFlavB > 0.2598 (DeepJet Medium WP),
#     objects_to_calculate = Electrons, Muons, Jets, BJets
#
# Not touched: config.cms_bjet_test.yaml, config.cms_records_master.yaml.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_bjet_with_histograms
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: true
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  # SingleElectron-only (records 30529, 30562 = /SingleElectron/Run2016G,H),
  # same scope as config.cms_bjet_test.yaml.
  specific_record_ids:
  - 30529
  - 30562
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 4
  env_threshold_memory_mb: 5000
  chunk_yield_threshold_bytes: 536870912
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 3
  # --- CMS b-jet tagging ---
  enable_jet_tagging: true
  jet_btagging_thresholds:
    Jet_btagDeepFlavB: 0.2598   # DeepJet Medium WP, UL2016 post-VFP
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  - Jets
  - BJets
  min_particles_in_combination: 2
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 5
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
