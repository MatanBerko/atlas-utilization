# ---------------------------------------------------------------------------
# config.cms_fourrecord_test.yaml
#
# Part C verification for CMS SingleMuon support: all FOUR CMS records with
# per-trigger-stream selection + cross-record de-duplication.
#
#   * 30529 /SingleElectron/Run2016G   -> global particle_counts (electron req.)
#   * 30562 /SingleElectron/Run2016H   -> global particle_counts (electron req.)
#   * 30530 /SingleMuon/Run2016G       -> selection_by_record (muon requirement)
#   * 30563 /SingleMuon/Run2016H       -> selection_by_record (muon requirement)
#
# The parsing handler processes the muon-requirement records first, so an event
# that fired both triggers keeps its SingleMuon copy and the SingleElectron copy
# is dropped by de-duplication on (run, luminosityBlock, event).
#
# Small: 2 files per record. Parsing + mass-calc + post-processing, so the
# dimuon (m0m1) Z-peak can be checked before and after cleanup. Parse memory
# knobs reduced (threads 4, chunk 512 MB) so a handful of ~2 GB NANOAOD files
# fit the 7 GB Docker container.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_fourrecord_test
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: false
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  specific_record_ids:
  - 30529
  - 30562
  - 30530
  - 30563
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 4
  env_threshold_memory_mb: 5000
  chunk_yield_threshold_bytes: 536870912
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 2
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  # Default selection: >=1 electron. Applies to any record NOT listed in
  # selection_by_record (i.e. the two SingleElectron records).
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  # Per-trigger-stream override for the SingleMuon records: require >=1 muon,
  # no electron requirement. Kinematic cuts stay global (below), unchanged.
  selection_by_record:
    "30530":
      particle_counts:
        muons:
          min: 1
          max: 4
        electrons:
          min: 0
          max: 4
        jets:
          min: 0
          max: 10
        photons:
          min: 0
          max: 4
    "30563":
      particle_counts:
        muons:
          min: 1
          max: 4
        electrons:
          min: 0
          max: 4
        jets:
          min: 0
          max: 10
        photons:
          min: 0
          max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    bjets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  min_particles_in_combination: 1
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 1
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
