# ---------------------------------------------------------------------------
# config.cms_production_test.yaml
#
# First end-to-end run of the FULL 5-stage pipeline on real CMS data:
#   fetch metadata -> parse -> compute invariant masses -> post-process
#   -> create histograms.
#
# This is a copy of config.cms_records_master.yaml with only these changes:
#   * tasks: all four do_* toggles set to true (master has only do_parsing on).
#     "Fetch metadata" is not a separate toggle - it runs automatically when
#     do_parsing is true (see main.py / pipeline/executor._create_initial_context).
#   * run_metadata.run_name        -> cms_production_test
#   * run_metadata.base_output_dir -> ./output   (local, inside the repo;
#                                                 master points at cluster storage)
#   * mass_calculation_task_config.input_dir -> ./output/parsed_data (relative,
#     so the run redirects it at this run's parsed_data; master pins an
#     absolute cluster path that does not exist locally). Mass-calc actually
#     consumes the files handed over by the parsing stage in-process, so this
#     only matters as a fallback.
#
# EVERYTHING ELSE IS LEFT EXACTLY AS IN config.cms_records_master.yaml:
#   max_files_to_process (2), objects_to_calculate (e/mu/jets/photons),
#   particle_counts, kinematic_cuts, min_events_per_fs (100), and all the
#   combination bounds. This is deliberately the production configuration, not
#   a narrowed diagnostic.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_production_test
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: true
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  specific_record_ids:
  - 30529
  - 30562
  - 30530
  - 30563
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 8
  env_threshold_memory_mb: 8000
  chunk_yield_threshold_bytes: 2147483648
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 2
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  - Jets
  - Photons
  min_particles_in_combination: 2
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 100
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
