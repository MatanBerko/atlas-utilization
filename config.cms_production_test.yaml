# ---------------------------------------------------------------------------
# config.cms_production_test.yaml
#
# Larger-scale end-to-end run of the full 5-stage pipeline on SingleElectron-
# only CMS data (records 30529, 30562). A local copy of
# config.cms_records_master.yaml with only these changes:
#   * tasks: all four do_* toggles on
#   * run_metadata.run_name        -> cms_production_singleelectron
#   * run_metadata.base_output_dir -> ./output  (local, inside the repo)
#   * parsing_task_config.max_files_to_process -> 4  (per record; = 8 files),
#     up from the earlier 1-2-file smoke test
#   * mass_calculation_task_config.input_dir -> relative ./output/parsed_data
#   * memory knobs, so the parse stage fits the 7.4 GB local Docker container
#     (an earlier attempt with 5 files/record + the master defaults was
#     OOM-killed while accumulating parsed events in RAM):
#       threads 8 -> 4
#       env_threshold_memory_mb 8000 -> 5000
#       chunk_yield_threshold_bytes 2 GB -> 512 MB  (flush parsed chunks to
#         disk far more often instead of holding them in memory)
#     These are operational/memory settings only - they do not affect the
#     physics selection or the results.
#
# specific_record_ids, particle_counts, kinematic_cuts, min_events_per_fs and
# all combination bounds are left exactly as config.cms_records_master.yaml.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_production_singleelectron
  base_output_dir: ./output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: true
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  # SingleElectron-only (see config.cms_records_master.yaml and
  # docs/CMS_KNOWN_LIMITATIONS.md for why the SingleMuon records are excluded).
  specific_record_ids:
  - 30529
  - 30562
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 4
  env_threshold_memory_mb: 5000
  chunk_yield_threshold_bytes: 536870912
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 4
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 1
      max: 4
    muons:
      min: 0
      max: 4
    jets:
      min: 0
      max: 10
    photons:
      min: 0
      max: 4
  kinematic_cuts:
    electrons:
      pt_min: 25.0
      eta_max: 2.47
    muons:
      pt_min: 25.0
      eta_max: 2.5
    jets:
      pt_min: 30.0
      eta_max: 4.5
    bjets:
      pt_min: 30.0
      eta_max: 4.5
    photons:
      pt_min: 25.0
      eta_max: 2.37
mass_calculation_task_config:
  input_dir: ./output/parsed_data
  output_dir: ./output/im_arrays
  field_to_slice_by: pt
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000
  objects_to_calculate:
  - Electrons
  - Muons
  - Jets
  - Photons
  min_particles_in_combination: 2
  max_particles_in_combination: 4
  min_count_particle_in_combination: 1
  max_count_particle_in_combination: 4
  min_events_per_fs: 100
post_processing_task_config:
  input_dir: ./output/im_arrays
  output_dir: ./output/im_arrays_processed
  peak_detection_bin_width_gev: 10.0
histogram_creation_task_config:
  input_dir: ./output/im_arrays_processed
  output_dir: ./output/histograms
  bin_width_gev: 10.0
  single_output_file: true
  output_filename: atlas_opendata_full_bumpnet.root
  exclude_outliers: true
  use_bumpnet_naming: true
