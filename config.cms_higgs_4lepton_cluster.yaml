# ---------------------------------------------------------------------------
# config.cms_higgs_4lepton_cluster.yaml
#
# FULL-SCALE H -> ZZ -> 4l Part B parsing run, for the Weizmann ATLAS Grid
# cluster (wipp-an1/an2, PBS queue N). Identical selection/kinematic settings
# to config.cms_higgs_4lepton_fullscale.yaml -- the ONLY difference is
# base_output_dir, which points at Lustre (/storage/agrp/berkom/...) instead
# of the local ./output used on the laptop. Home (/srv01/agrp/berkom) must
# never be written to by a batch job, per the cluster storage rules.
#
# All files in all six records below (max_files_to_process: null) -- 238
# files, ~294 GiB raw, streamed via XRootD (never downloaded wholesale; only
# the small parsed output, ~2.7 GB based on the prior successful pre-Part-B
# full run, is written to Lustre).
#
# Six CMS Open Data records (UL2016 MiniAODv2 NanoAODv9, 13 TeV):
#   30521  /DoubleEG/Run2016G-...   47 files,  78,797,031 evt,  70.5 GiB
#   30554  /DoubleEG/Run2016H-...   86 files,  85,388,673 evt,  78.1 GiB
#   30522  /DoubleMuon/Run2016G-... 29 files,  45,235,604 evt,  39.3 GiB
#   30555  /DoubleMuon/Run2016H-... 28 files,  48,912,812 evt,  42.9 GiB
#   30528  /MuonEG/Run2016G-...     29 files,  33,854,612 evt,  33.2 GiB
#   30561  /MuonEG/Run2016H-...     19 files,  29,236,516 evt,  29.9 GiB
#   total: 238 files, 321,425,248 events, ~293.9 GiB (~316 GB)
#
# do_mass_calculating/do_post_processing/do_histogram_creation are OFF: the
# 4-lepton invariant mass is computed directly from the parsed
# Electron/Muon collections in the Part B analysis script, not via the
# generic mass-calculation stage. Part B's impact-parameter fields
# (sip3d/dxy/dz) are already in services/parsing/schemas.py -- no schema
# change needed here, this config only sets parse-time selection + paths.
#
# threads: 1, single-record-at-a-time processing (specific_record_ids order
# below), matching the laptop run's proven-stable settings.
# ---------------------------------------------------------------------------
paths:
  parsed_data_path: ./output/parsed_data
  im_arrays_path: ./output/im_arrays
  im_arrays_processed_path: ./output/im_arrays_processed
  histograms_path: ./output/histograms
  metadata_cache_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
names:
  run_name: atlas_full_120
  histogram_filename: atlas_opendata_full_bumpnet.root
run_metadata:
  run_name: cms_higgs_4lepton_cluster_fullscale
  base_output_dir: /storage/agrp/berkom/atlas-utilization/output
  batch_job_index: null
  total_batch_jobs: null
tasks:
  do_parsing: true
  do_mass_calculating: false
  do_post_processing: false
  do_histogram_creation: false
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: ./testing_jobs
  limit_files_per_year: null
  limit_combinations: null
parsing_task_config:
  output_path: ./output/parsed_data
  file_urls_path: ./output/metadata_cache.json
  jobs_logs_path: ./output/logs
  release_years: []
  specific_record_ids:
  - 30521
  - 30554
  - 30522
  - 30555
  - 30528
  - 30561
  parse_mc: false
  use_multiprocessing: false
  parallel_processes: 4
  threads: 1
  env_threshold_memory_mb: 5000
  chunk_yield_threshold_bytes: 536870912
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: null
  possible_data_tree_names:
  - Events
  - CollectionTree
  - mini
  - analysis
  create_dirs: true
  show_progress_bar: true
  particle_counts:
    electrons:
      min: 0
      max: 20
    muons:
      min: 0
      max: 20
    jets:
      min: 0
      max: 30
    photons:
      min: 0
      max: 10
  selection_by_record:
    "30521": &record_profile
      particle_counts:
        electrons:
          min: 0
          max: 20
        muons:
          min: 0
          max: 20
        jets:
          min: 0
          max: 30
        photons:
          min: 0
          max: 10
      combined_particle_counts:
        fields: [electrons, muons]
        min: 4
    "30554": *record_profile
    "30522": *record_profile
    "30555": *record_profile
    "30528": *record_profile
    "30561": *record_profile
  kinematic_cuts:
    electrons:
      pt_min: 7.0
      eta_max: 2.5
    muons:
      pt_min: 5.0
      eta_max: 2.4
